name: PKDEV_TATA_Pipeline

on:
  push:
    branches:
      - main


jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Make maven wrapper executable
        run: chmod +x mvnw

      - name: Build Maven
        run: |
          ./mvnw clean package

      - name: Verify Target
        run: |
          ls -lh target

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pkdev-tata-project
          path: target/*.jar

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/pkdev-tata:latest
          
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Push Docker Image to DockerHub
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/pkdev-tata:latest